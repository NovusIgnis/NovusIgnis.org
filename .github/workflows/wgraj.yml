# Novus Ignis · automatyczne wgranie strony na hosting Infomaniak.
#
# Po każdej zmianie w gałęzi main (np. zaakceptowanej poprawce tłumaczenia) GitHub:
#   1. buduje stronę (tools/build.mjs),
#   2. uruchamia kontrole (tools/check.mjs, tools/paczka.mjs); przy błędzie zatrzymuje się i niczego nie wysyła,
#   3. wysyła przez SFTP do folderu strony na Infomaniaku tylko pliki zmienione od poprzedniego wgrania
#      (porównuje odciski SHA-256 z listą .wgranie-sumy.txt na serwerze, tools/wgranie-roznice.mjs);
#      gdy listy nie ma albo zmienia się większość plików, wysyła całość.
# Można też uruchomić ręcznie: zakładka Actions → „Wgranie strony” → Run workflow (opcja „pełne” wysyła całość).
#
# Dane dostępu są w Settings → Secrets and variables → Actions (wpisuje je Marcin, nie trafiają do repozytorium):
#   sekrety:  SFTP_HOST, SFTP_USER, SFTP_KEY (prywatny klucz ed25519), SFTP_KNOWN_HOSTS (wynik ssh-keyscan)
#   zmienne:  SFTP_DIR (folder strony na serwerze), SFTP_DELETE ("tak" = usuwaj z serwera pliki, których nie ma w paczce)
# Instrukcja krok po kroku: WGRYWANIE.md.

name: Wgranie strony

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pelne:
        description: 'Wyślij całą stronę (bez porównania z listą na serwerze)'
        type: boolean
        default: false

concurrency:
  group: wgranie-strony
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wgraj:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Budowa strony
        run: node tools/build.mjs

      - name: Kontrola stron
        run: node tools/check.mjs

      - name: Paczka i kontrola odnośników
        run: node tools/paczka.mjs

      - name: Brakujące ustawienia
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_DIR: ${{ vars.SFTP_DIR }}
        run: |
          for v in SFTP_HOST SFTP_USER SFTP_KEY SFTP_KNOWN_HOSTS SFTP_DIR; do
            if [ -z "${!v}" ]; then echo "Brak ustawienia $v (zob. WGRYWANIE.md)."; exit 1; fi
          done
          case "$SFTP_DIR" in /|""|.) echo "SFTP_DIR nie może być korzeniem hostingu."; exit 1;; esac

      - name: Klucz SSH
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/wgranie
          chmod 600 ~/.ssh/wgranie
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wysłanie na Infomaniak
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_DIR: ${{ vars.SFTP_DIR }}
          SFTP_DELETE: ${{ vars.SFTP_DELETE }}
          PELNE: ${{ inputs.pelne }}
        run: |
          OPEN="set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/wgranie -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes';
            set net:max-retries 3; set cmd:fail-exit yes;
            open -u '$SFTP_USER',x sftp://$SFTP_HOST; cd '$SFTP_DIR'"
          # lista odcisków z poprzedniego wgrania; bez niej (albo przy ręcznym „pełne”) wysyłamy całość
          rm -f stare-sumy.txt
          if [ "$PELNE" != "true" ]; then
            lftp -c "$OPEN; get .wgranie-sumy.txt -o stare-sumy.txt" || echo "Brak listy z poprzedniego wgrania."
          fi
          DEL=""; USUN=""
          if [ "$SFTP_DELETE" = "tak" ]; then DEL="--delete"; USUN="--usun"; fi
          TRYB=$(node tools/wgranie-roznice.mjs dist stare-sumy.txt nowe-sumy.txt polecenia.lftp $USUN)
          if [ "$TRYB" = "roznice" ]; then
            lftp -c "$OPEN; source polecenia.lftp"
          else
            lftp -c "$OPEN; mirror --reverse $DEL --verbose --parallel=4 --exclude-glob .ssh/ --exclude-glob .well-known/ --exclude-glob .htaccess --exclude-glob .wgranie-sumy.txt dist/ ."
          fi
          # nowa lista na końcu, dopiero po udanym wysłaniu
          lftp -c "$OPEN; put nowe-sumy.txt -o .wgranie-sumy.txt"

      # Formularz OmniVox (api/omnivox.php): plik konfiguracji z kluczem aplikacji GitHub idzie POZA folder strony
      # (../omnivox/config.php względem SFTP_DIR), więc nie da się go pobrać przez przeglądarkę. Krok działa dopiero,
      # gdy w środowisku prod jest zmienna OMNIVOX_APP_ID (WGRYWANIE.md, krok 8).
      - name: Konfiguracja formularza OmniVox
        if: ${{ vars.OMNIVOX_APP_ID != '' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_DIR: ${{ vars.SFTP_DIR }}
          OMNIVOX_APP_ID: ${{ vars.OMNIVOX_APP_ID }}
          OMNIVOX_INSTALLATION_ID: ${{ vars.OMNIVOX_INSTALLATION_ID }}
          OMNIVOX_WLACZONY: ${{ vars.OMNIVOX_WLACZONY }}
          OMNIVOX_PROBA: ${{ vars.OMNIVOX_PROBA }}
          OMNIVOX_PRIVATE_KEY: ${{ secrets.OMNIVOX_PRIVATE_KEY }}
        run: |
          umask 077
          node tools/omnivox-config.mjs > omnivox-config.php
          lftp -c "set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/wgranie -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes';
            set net:max-retries 3; set cmd:fail-exit yes;
            open -u '$SFTP_USER',x sftp://$SFTP_HOST; cd '$SFTP_DIR'; mkdir -p -f ../omnivox;
            put omnivox-config.php -o ../omnivox/config.php; chmod 600 ../omnivox/config.php"
          rm -f omnivox-config.php
